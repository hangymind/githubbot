# Insert these locations INSIDE the existing HTTPS server {}.
# Configure the certificate using Certbot or the BT panel.
# Never expose .env, the database, source files, or the project folder as a static site.
location = /webhooks/github {
    client_max_body_size 26m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    access_log off;
}
location = /webhooks/qq {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    access_log off;
}
location = /healthz {
    proxy_pass http://127.0.0.1:8000;
    access_log off;
}
location / {
    return 404;
}
